name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r .version plugin.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "plugin.json version must be a release version, got: $version" >&2
            exit 1
          fi
          tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME does not match plugin.json version $version (expected $tag)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build bundle
        run: make dist

      - name: Verify bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="dist/com.github.3tty0n.mattermost-tasks-${{ steps.version.outputs.version }}.tar.gz"
          test -f "$bundle"
          tar -tzf "$bundle" > dist/bundle-contents.txt
          grep -qx "com.github.3tty0n.mattermost-tasks/plugin.json" dist/bundle-contents.txt
          executable="$(jq -r '.server.executables["linux-amd64"]' plugin.json)"
          test -f "dist/com.github.3tty0n.mattermost-tasks/${executable}"
          sha256sum "$bundle" > dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            dist/com.github.3tty0n.mattermost-tasks-*.tar.gz \
            dist/SHA256SUMS
